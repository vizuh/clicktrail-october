# ClickTrail plugin settings.
# Site ID + API endpoint identify the tenant; the consent section gates behavior.
tabs:
    fields:
        site_id:
            span: auto
            label: vizuh.clicktrail::lang.settings.site_id
            commentAbove: vizuh.clicktrail::lang.settings.site_id_comment
            tab: vizuh.clicktrail::lang.settings.tab_general

        api_endpoint:
            span: auto
            label: vizuh.clicktrail::lang.settings.api_endpoint
            commentAbove: vizuh.clicktrail::lang.settings.api_endpoint_comment
            tab: vizuh.clicktrail::lang.settings.tab_general

        consent_section:
            type: section
            label: vizuh.clicktrail::lang.settings.consent_section
            comment: vizuh.clicktrail::lang.settings.consent_section_comment
            tab: vizuh.clicktrail::lang.settings.tab_privacy

        consent_resolver_class:
            span: auto
            label: vizuh.clicktrail::lang.settings.consent_resolver_class
            commentAbove: vizuh.clicktrail::lang.settings.consent_resolver_class_comment
            commentHtml: true
            tab: vizuh.clicktrail::lang.settings.tab_privacy

        require_analytics_storage:
            type: switch
            span: auto
            default: true
            label: vizuh.clicktrail::lang.settings.require_analytics_storage
            comment: vizuh.clicktrail::lang.settings.require_analytics_storage_comment
            tab: vizuh.clicktrail::lang.settings.tab_privacy

        require_advertising_storage:
            type: switch
            span: auto
            default: true
            label: vizuh.clicktrail::lang.settings.require_advertising_storage
            comment: vizuh.clicktrail::lang.settings.require_advertising_storage_comment
            tab: vizuh.clicktrail::lang.settings.tab_privacy

        forward_hashed_lead_data:
            type: switch
            span: auto
            default: false
            label: vizuh.clicktrail::lang.settings.forward_hashed_lead_data
            comment: vizuh.clicktrail::lang.settings.forward_hashed_lead_data_comment
            tab: vizuh.clicktrail::lang.settings.tab_privacy

        unknown_consent_section:
            type: section
            label: vizuh.clicktrail::lang.settings.unknown_consent_section
            comment: vizuh.clicktrail::lang.settings.unknown_consent_section_comment
            tab: vizuh.clicktrail::lang.settings.tab_privacy

        first_party_proxy:
            type: switch
            span: auto
            default: false
            label: vizuh.clicktrail::lang.settings.first_party_proxy
            comment: vizuh.clicktrail::lang.settings.first_party_proxy_comment
            tab: vizuh.clicktrail::lang.settings.tab_privacy
