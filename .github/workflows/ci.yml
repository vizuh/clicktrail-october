name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3"]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Syntax check all PHP files
        run: |
          find . -name "*.php" -not -path "./vendor/*" -print0 | xargs -0 -n1 php -l

      - name: Validate YAML files parse
        run: |
          python3 - <<'"'"'PY'"'"'
          import glob, sys, yaml
          files = sorted(glob.glob("**/*.yaml", recursive=True)) + sorted(glob.glob("**/*.yml", recursive=True))
          for f in files:
              yaml.safe_load(open(f))
              print("OK", f)
          PY
